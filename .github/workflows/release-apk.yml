name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
      - fix/android-sdk-setup
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Aura Control APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools: '36.0.0'
          components: 'platform-tools,build-tools;36.0.0,platforms;android-36,platforms;android-36.1'
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36 platforms;android-36.1'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Prepare Environment (.env)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
          else
            cp .env.example .env
          fi

      - name: Build Signed APK (Debug / Firebase Auth Configured)
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare Release APK File
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AuraControl-v1.2.apk

      - name: Upload APK to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AuraControl-v1.2-APK
          path: AuraControl-v1.2.apk
          if-no-files-found: error

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Aura Control v1.2 — Голосовой AI-Ассистент для Android"
          body: |
            ## Aura Control v1.2 (Android APK)
            Голосовой AI-ассистент для управления Android с озвучиванием ответов (TTS), системными командами, пользовательскими сценариями автоматизации и облачной синхронизацией через Firebase и Google Sign-In.

            ### Установка
            1. Скачайте файл **`AuraControl-v1.2.apk`** из раздела **Assets** ниже.
            2. Откройте файл на Android-устройстве и подтвердите установку.
            3. При первом запуске предоставьте разрешение на доступ к микрофону для голосового управления.
          files: AuraControl-v1.2.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
